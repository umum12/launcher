<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#F6F8FC" />
  <meta name="color-scheme" content="dark light" />
  <title>FAST HUB</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FAST HUB">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
      --space-6: 40px;

      --radius-btn: 14px;
      --radius-input: 16px;
      --radius-card: 20px;
      --radius-modal: 24px;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 1px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 24px -6px rgba(15, 23, 42, 0.16), 0 4px 8px -2px rgba(15, 23, 42, 0.08);

      --color-bg: #0F172A;
      --color-surface: #1E293B;
      --color-border: #334155;
      --color-text: #F8FAFC;
      --color-text-secondary: #CBD5E1;

      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-soft: rgba(37, 99, 235, 0.18);

      --status-online: #22C55E;
      --status-online-bg: rgba(34, 197, 94, 0.16);
      --status-dev: #F59E0B;
      --status-dev-bg: rgba(245, 158, 11, 0.16);
      --status-maint: #EF4444;
      --status-maint-bg: rgba(239, 68, 68, 0.16);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body.theme-light {
      --color-bg: #F6F8FC;
      --color-surface: #FFFFFF;
      --color-border: #E5E7EB;
      --color-text: #111827;
      --color-text-secondary: #6B7280;

      --status-online-bg: rgba(22, 163, 74, 0.12);
      --status-dev-bg: rgba(217, 119, 6, 0.12);
      --status-maint-bg: rgba(220, 38, 38, 0.12);

      --status-online: #16A34A;
      --status-dev: #D97706;
      --status-maint: #DC2626;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body { display: flex; justify-content: center; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(60% 38% at 12% -4%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%),
        radial-gradient(45% 32% at 100% 28%, rgba(156, 194, 71, 0.14), transparent 70%),
        radial-gradient(50% 30% at 0% 100%, rgba(31, 78, 156, 0.16), transparent 70%);
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      padding:
        calc(var(--space-4) + env(safe-area-inset-top))
        max(var(--space-3), env(safe-area-inset-right))
        calc(var(--space-4) + env(safe-area-inset-bottom))
        max(var(--space-3), env(safe-area-inset-left));
    }

    @media (min-width: 600px)  { .app { max-width: 640px; } }
    @media (min-width: 1024px) { .app { max-width: 920px; } }

    .header { display: flex; flex-direction: column; gap: var(--space-2); }
    .brand { display: flex; align-items: center; gap: var(--space-2); }

    .brand-mark {
      display: block;
      height: 40px;
      flex-shrink: 0;
    }
    .brand-mark svg { display: block; height: 100%; width: auto; }
    body:not(.theme-light) .fs-blue { fill: #5B8DEF; } /* biru logo lebih terang di mode gelap */

    .theme-btn {
      margin-left: auto;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: color-mix(in srgb, var(--color-surface) 72%, transparent);
      color: var(--color-text);
      font-size: 18px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .theme-btn:active { transform: scale(0.94); }
    .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .summary { margin: 0; font-size: 14px; font-weight: 500; color: var(--color-text-secondary); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px);
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--color-text);
      color: var(--color-bg);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1200;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .title-wrap { display: flex; flex-direction: column; min-width: 0; }

    .title {
      margin: 0;
      font-size: clamp(18px, 5vw, 30px);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .tagline {
      margin-top: 2px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.35;
      color: color-mix(in srgb, var(--accent) 65%, var(--color-text));
    }

    .datetime {
      margin-top: 2px;
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.4;
      font-weight: 500;
    }

    .section-title {
      margin: 0 0 var(--space-2);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: var(--space-2);
      min-height: 44px;
      padding: var(--space-4) var(--space-3);
      background:
        linear-gradient(150deg, color-mix(in srgb, var(--c, var(--accent)) 16%, transparent), transparent 65%),
        color-mix(in srgb, var(--color-surface) 72%, transparent);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 26%, var(--color-border));
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      animation: rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: calc(var(--i, 0) * 50ms);
    }

    .card.full { grid-column: 1 / -1; }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: color-mix(in srgb, var(--accent) 30%, var(--color-border));
    }
    .card:active { transform: scale(0.98); }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
      background: color-mix(in srgb, var(--c, var(--accent)) 18%, transparent);
      border: 1px solid color-mix(in srgb, var(--c, var(--accent)) 32%, transparent);
      box-shadow: 0 8px 18px -8px var(--c, var(--accent));
    }

    .label { font-size: 16px; font-weight: 600; line-height: 1.3; }
    .desc  { font-size: 13px; font-weight: 400; color: var(--color-text-secondary); line-height: 1.45; }

    .badge {
      display: inline-flex;
      align-items: center;
      margin-top: var(--space-1);
      padding: 3px var(--space-2);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .badge.online { color: var(--status-online); background: var(--status-online-bg); }
    .badge.dev    { color: var(--status-dev);    background: var(--status-dev-bg); }
    .badge.maint  { color: var(--status-maint);  background: var(--status-maint-bg); }
    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge.online::before { animation: pulse 1.8s ease-out infinite; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 55%, transparent); }
      100% { box-shadow: 0 0 0 7px transparent; }
    }

    .empty-state {
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 13px;
      padding: var(--space-6) 0;
    }
    .empty-state .btn { margin-top: var(--space-3); padding: 0 var(--space-4); }

    .footer {
      display: flex;
      justify-content: center;
      margin-top: auto;
      padding-top: var(--space-2);
    }

    .pill {
      font-size: 12px;
      color: var(--color-text-secondary);
      padding: var(--space-1) var(--space-3);
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    .state-backdrop {
      position: fixed;
      inset: 0;
      height: 100dvh;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        max(var(--space-3), env(safe-area-inset-top))
        max(var(--space-3), env(safe-area-inset-right))
        max(var(--space-3), env(safe-area-inset-bottom))
        max(var(--space-3), env(safe-area-inset-left));
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.6);
      z-index: 1000;
      animation: backdropFade 0.15s ease both;
    }
    .state-backdrop { z-index: 1100; }

    .state-panel {
      width: 100%;
      max-width: 340px;
      max-height: 100%;
      overflow-y: auto;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-modal);
      box-shadow: var(--shadow-md);
      padding: var(--space-4);
      animation: panelIn 0.2s ease both;
      flex-shrink: 0;
    }
    .state-panel { text-align: center; }

    .state-title { margin: 0 0 var(--space-1); font-size: 16px; font-weight: 600; }

    .state-copy { margin: 0; color: var(--color-text-secondary); font-size: 13px; line-height: 1.5; }

    .btn {
      min-height: 48px;
      border: none;
      border-radius: var(--radius-btn);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn-ok, .btn-back { background: var(--accent); color: #fff; }
    .btn-ok:hover:not(:disabled), .btn-back:hover { background: var(--accent-hover); }
    .btn-back { width: 100%; margin-top: var(--space-4); }

    .state-icon { font-size: 40px; line-height: 1; margin-bottom: var(--space-2); display: inline-block; }
    .state-name { font-size: 16px; font-weight: 600; margin-bottom: var(--space-1); }
    .state-headline { font-size: 16px; font-weight: 600; margin: var(--space-2) 0 var(--space-1); }

    .state-progress {
      margin: var(--space-4) 0 var(--space-3);
      padding: var(--space-2);
      border-radius: var(--radius-input);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      overflow: hidden;
    }

    .bar { position: relative; height: 6px; border-radius: 999px; background: var(--color-border); overflow: hidden; }
    .bar::before {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: 999px;
      background: var(--status-dev);
      animation: loadingBar 1.1s ease-in-out infinite;
    }
    .bar.warn::before { background: var(--status-maint); }

    .hint { font-size: 12px; color: var(--color-text-secondary); margin-top: var(--space-3); }

    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 380ms ease-out;
      background: rgba(0, 0, 0, 0.06);
      pointer-events: none;
    }
    body:not(.theme-light) .ripple { background: rgba(255, 255, 255, 0.10); }

    @keyframes ripple { to { transform: scale(4.2); opacity: 0; } }
    @keyframes loadingBar { 0% { transform: translateX(-90%); } 100% { transform: translateX(260%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes backdropFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes panelIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 1229 625"><path class="fs-blue" fill="#1F4E9C" fill-rule="evenodd" d="M9 602L324 60Q349 17 392 17L772 17L474 530Q433 602 392 602ZM178 474L253 474L332 340L522 340L561 272L372 272L404 215Q420 199 440 199L620 199L657 132L408 132Q372 132 350 175Z"/><path fill="#9CC247" fill-rule="evenodd" d="M480 625L721 198Q760 131 808 131L1170 131L914 581Q889 625 850 625ZM597 537L845 537Q880 537 902 498L964 388Q972 345 936 345L797 345Q782 345 788 329L806 299Q818 287 842 287L1018 287L1055 220L806 220Q775 220 755 255L690 376Q686 411 714 411L861 411Q872 412 870 424L851 457Q845 470 827 471L632 471Z"/><path fill="#D6312B" d="M803 17L1222 17L1177 97L759 97Z"/></svg>
        </span>
        <div class="title-wrap">
          <h1 class="title" id="appTitle">FAST HUB</h1>
          <div class="tagline" id="tagline">Integrated Facility Support &amp; Services</div>
          <div class="datetime" id="dateTime">Memuat waktu...</div>
        </div>
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Ganti tema">🌙</button>
      </div>
      <p class="summary" id="summary"></p>
    </header>

    <section aria-label="Semua Aplikasi">
      <h2 class="section-title">Aplikasi yang tersedia</h2>
      <div class="grid" id="grid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <div id="emptyText">Memuat aplikasi...</div>
        <button class="btn btn-ok" id="retryBtn" hidden>Coba lagi</button>
      </div>
    </section>

    <footer class="footer">
      <span class="pill" id="footerPill">Facility Support Launcher © 2025</span>
    </footer>
  </main>

  <div class="state-backdrop" id="stateOverlay" aria-hidden="true">
    <div class="state-panel">
      <div class="state-icon" id="stateIcon">🚧</div>
      <div class="state-title" id="stateTopLabel">DEVELOPMENT</div>
      <div class="state-name" id="stateName">APP</div>
      <div class="state-headline" id="stateHeadline">Development in Progress...</div>
      <div class="state-copy" id="stateCopy">This feature is not available yet. Please check back soon.</div>
      <div class="state-progress"><div class="bar" id="stateBar"></div></div>
      <div class="hint" id="stateHint">Tap layar untuk kembali</div>
      <button class="btn btn-back" id="stateBack">Kembali</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* ===== Default tampilan (bisa ditimpa config.js / Script Properties CONFIG) ===== */
    const DEFAULTS = {
      APP_NAME: 'FAST HUB ™',
      TAGLINE: 'Integrated Facility Support & Services',
      VERSION: '2.4.0',
      FOOTER: 'Facility Support Launcher © 2021',
      ENABLE_VIBRATE: true,
      ENABLE_RIPPLE: true,
      THEME: 'auto', // auto | light | dark
      ACCENT: '#2563EB'
    };
    const CONFIG = Object.assign({}, DEFAULTS, window.FS_CONFIG || {});
    let APPS = [];
    let lastSig = '';

    /* ===== Lapisan data: fetch ke Apps Script /exec ===== */
    const CACHE_KEY = 'fs_apps_v5';
    const API = {
      async load() {
        if (!CONFIG.API_URL) throw new Error('API_URL belum diisi di config.js');
        const res = await fetch(CONFIG.API_URL + '?action=apps&t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      },
      cacheGet() {
        try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; }
      },
      cacheSet(data) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
      }
    };


    const $ = (id) => document.getElementById(id);
    const grid = $('grid'), emptyState = $('emptyState'), emptyText = $('emptyText'), retryBtn = $('retryBtn');
    const appTitle = $('appTitle'), footerPill = $('footerPill'), dateTimeEl = $('dateTime');
    const summaryEl = $('summary'), themeBtn = $('themeBtn'), toast = $('toast'), taglineEl = $('tagline');
    const stateOverlay = $('stateOverlay'), stateIcon = $('stateIcon'), stateTopLabel = $('stateTopLabel');
    const stateName = $('stateName'), stateHeadline = $('stateHeadline'), stateCopy = $('stateCopy');
    const stateBar = $('stateBar'), stateHint = $('stateHint'), stateBack = $('stateBack');

    let userTheme = null; // pilihan manual dari tombol tema
    try { userTheme = localStorage.getItem('fs_theme'); } catch (e) {}

    function isDarkTheme() {
      const t = userTheme || CONFIG.THEME;
      if (t === 'dark') return true;
      if (t === 'light') return false;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function applyTheme() {
      document.body.classList.toggle('theme-light', !isDarkTheme());
      document.body.style.setProperty('--accent', CONFIG.ACCENT);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', isDarkTheme() ? '#0f172a' : '#F6F8FC');
      themeBtn.textContent = isDarkTheme() ? '☀️' : '🌙';
    }

    function vibrate(ms = 20) {
      try { if (CONFIG.ENABLE_VIBRATE && navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
    }

    function createRipple(card, event) {
      if (!CONFIG.ENABLE_RIPPLE) return;
      const rect = card.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (event.clientY - rect.top - size / 2) + 'px';
      card.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function badgeMeta(app) {
      if (app.status === 'construction') return { text: 'DEVELOPMENT', cls: 'dev' };
      if (app.status === 'maintenance') return { text: 'MAINTENANCE', cls: 'maint' };
      return { text: 'ONLINE', cls: 'online' };
    }

    function cardHTML(app, index) {
      const badge = badgeMeta(app);
      const ariaLabel = escapeHtml(app.name + (app.subtitle ? ', ' + app.subtitle : ''));
      const color = /^#[0-9a-f]{3,8}$/i.test(app.color) ? app.color : '#2563eb';
      const direct = app.status === 'online' && /^https?:\/\//i.test(app.url || '');
      const link = direct ? `href="${escapeHtml(app.url)}" target="_blank" rel="noopener noreferrer"` : 'href="#"';
      return `
        <a class="card${app.fullWidth ? ' full' : ''}" ${link} data-index="${index}" style="--c:${color};--i:${index}" aria-label="${ariaLabel}">
          <div class="icon">${escapeHtml(app.icon || '🔗')}</div>
          <div class="label">${escapeHtml(app.name)}</div>
          <div class="desc">${escapeHtml(app.subtitle || '')}</div>
          <span class="badge ${badge.cls}">${badge.text}</span>
        </a>`;
    }

    function renderHeader() {
      appTitle.textContent = CONFIG.APP_NAME;
      taglineEl.textContent = CONFIG.TAGLINE || '';
      taglineEl.hidden = !CONFIG.TAGLINE;
      document.title = CONFIG.APP_NAME;
      footerPill.textContent = `${CONFIG.FOOTER} • v${CONFIG.VERSION}`;
      applyTheme();
    }

    function renderApps() {
      renderHeader();
      if (!APPS.length) {
        grid.innerHTML = '';
        lastSig = '';
        showEmpty('Tidak ada aplikasi yang tersedia.', false);
        return;
      }
      const sig = JSON.stringify(APPS);
      if (sig !== lastSig) { grid.innerHTML = APPS.map(cardHTML).join(''); lastSig = sig; } // hindari animasi ulang
      emptyState.hidden = true;
      updateSummary();
    }

    function showEmpty(text, canRetry) {
      emptyText.textContent = text;
      retryBtn.hidden = !canRetry;
      emptyState.hidden = false;
    }

    function applyData(data) {
      if (!data || !Array.isArray(data.apps)) throw new Error('Format data tidak valid');
      Object.assign(CONFIG, data.config || {});
      APPS = data.apps;
      renderApps();
      handleOpenParam();
    }

    async function loadApps() {
      const hadCache = APPS.length > 0;
      if (!hadCache) { grid.innerHTML = ''; showEmpty('Memuat aplikasi...', false); }
      try {
        const data = await API.load();
        applyData(data);
        API.cacheSet(data);
      } catch (err) {
        if (!hadCache) showEmpty('Gagal memuat daftar aplikasi. Periksa koneksi, lalu coba lagi.', true);
      }
    }

    function greeting() {
      const h = Number(new Intl.DateTimeFormat('en-GB', { hour: 'numeric', hourCycle: 'h23', timeZone: 'Asia/Jakarta' }).format(new Date()));
      return h < 4 ? 'Selamat malam' : h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam';
    }

    function updateSummary() {
      const online = APPS.filter((a) => a.status === 'online').length;
      const text = APPS.length ? `${greeting()} 👋 • ${online} dari ${APPS.length} aplikasi online` : `${greeting()} 👋`;
      if (summaryEl.textContent !== text) summaryEl.textContent = text;
    }

    // Pintasan PWA: ./?open=LAPORAN langsung membuka aplikasi
    let openParam = null;
    try { openParam = new URLSearchParams(location.search).get('open'); } catch (e) {}
    function handleOpenParam() {
      if (!openParam || !APPS.length || !APPS[0].id) return;
      const key = openParam.toUpperCase();
      openParam = null;
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      const app = APPS.find((a) => a.id === key);
      if (app) handleCard(app);
    }

    function setDateTime() {
      const now = new Date();
      const dateText = new Intl.DateTimeFormat('id-ID', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Jakarta'
      }).format(now);
      const timeText = new Intl.DateTimeFormat('id-ID', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Jakarta'
      }).format(now);
      dateTimeEl.textContent = `${dateText} • ${timeText} WIB`;
      updateSummary();
    }

    /* ===== Buka URL ===== */
    function openUrl(url) {
      let opened = null;
      try { opened = window.open(url, '_blank'); } catch (e) {}
      if (opened) return;
      try { window.top.location.href = url; } catch (e) { window.location.href = url; }
    }

    /* ===== Overlay status ===== */
    function showState(app) {
      const isMaint = app.status === 'maintenance';
      stateIcon.textContent = isMaint ? '🛠' : '🚧';
      stateTopLabel.textContent = isMaint ? 'MAINTENANCE' : 'DEVELOPMENT';
      stateName.textContent = app.name || 'APP';
      stateHeadline.textContent = isMaint ? 'System Maintenance' : 'Development in Progress...';
      stateCopy.textContent = isMaint ? 'Please try again later.' : 'This feature is not available yet. Please check back soon.';
      stateBar.className = 'bar ' + (isMaint ? 'warn' : '');
      stateHint.textContent = 'Tap layar untuk kembali';
      stateOverlay.style.display = 'flex';
      history.pushState({ fsOverlay: true }, '', location.href);
    }

    function hideState() {
      if (stateOverlay.style.display === 'flex') stateOverlay.style.display = 'none';
    }

    function cancelStateAndGoHome() {
      hideState();
      if (history.state && history.state.fsOverlay) {
        try { history.back(); } catch (e) {}
      }
    }

    function handleCard(app) {
      if (app.status === 'construction' || app.status === 'maintenance') { showState(app); return; }
      if (app.url) openUrl(app.url);
    }

    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if (!card) return;
      if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
      createRipple(card, e);
      vibrate(18);
      if (card.hasAttribute('target')) return; // link asli: dibuka langsung oleh browser
      e.preventDefault();
      const app = APPS[Number(card.dataset.index)];
      if (app) handleCard(app);
    });

    /* ===== Tekan lama kartu = salin link ===== */
    let pressTimer = null, pressX = 0, pressY = 0, suppressClick = false, toastTimer = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function legacyCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove();
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
      }
      legacyCopy(text);
      return Promise.resolve();
    }

    function cancelPress() { clearTimeout(pressTimer); pressTimer = null; }

    grid.addEventListener('pointerdown', (e) => {
      suppressClick = false;
      const card = e.target.closest('.card');
      if (!card) return;
      const app = APPS[Number(card.dataset.index)];
      if (!app || !app.url) return;
      pressX = e.clientX; pressY = e.clientY;
      pressTimer = setTimeout(() => {
        pressTimer = null;
        suppressClick = true;
        vibrate(30);
        copyText(app.url).then(() => showToast('Link ' + app.name + ' disalin'));
      }, 550);
    });
    grid.addEventListener('pointermove', (e) => {
      if (pressTimer && Math.hypot(e.clientX - pressX, e.clientY - pressY) > 8) cancelPress();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => grid.addEventListener(t, cancelPress));
    grid.addEventListener('contextmenu', (e) => { if (e.target.closest('.card')) e.preventDefault(); });

    themeBtn.addEventListener('click', () => {
      userTheme = isDarkTheme() ? 'light' : 'dark';
      try { localStorage.setItem('fs_theme', userTheme); } catch (e) {}
      applyTheme();
      vibrate(12);
    });

    stateOverlay.addEventListener('click', cancelStateAndGoHome);
    stateBack.addEventListener('click', (e) => { e.stopPropagation(); cancelStateAndGoHome(); });
    retryBtn.addEventListener('click', loadApps);

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (stateOverlay.style.display === 'flex') hideState();
    });

    window.addEventListener('popstate', hideState);

    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const onChange = () => { if (!userTheme && CONFIG.THEME === 'auto') applyTheme(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }

    /* ===== Mulai ===== */
    renderHeader();
    setDateTime();
    setInterval(setDateTime, 1000);

    const cached = API.cacheGet();
    if (cached) { try { applyData(cached); } catch (e) {} }
    loadApps();


    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
